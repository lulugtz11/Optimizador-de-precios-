<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predicción de insumos para fondas · CDMX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#03264f; --navy-2:#173b66; --cream:#faf2e7; --card:#fffdf9; --line:#e9e1d3; --grid:#efe8dc;
  --coral:#f64357; --coral-ink:#c4223a; --green:#6ba956; --green-ink:#3d7a2a; --amber:#fbb02d; --amber-ink:#9a6400;
  --brown:#5b4a3f; --ink:#0f1d2e; --ink-2:#4a5565; --muted:#7c8592; --gray:#9aa3ad;
  --head:"Oswald","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 var(--body)}
.stripe{position:fixed;left:0;top:0;bottom:0;width:10px;display:flex;flex-direction:column;z-index:5}
.stripe i{flex:1}.stripe i:nth-child(1){background:var(--coral)}.stripe i:nth-child(2){background:var(--green)}
.stripe i:nth-child(3){background:var(--amber)}.stripe i:nth-child(4){background:var(--brown)}
header{background:var(--navy);color:#fff;padding:18px 28px 0 38px}
header h1{font:700 30px/1.05 var(--head);letter-spacing:.5px;margin:0;text-transform:uppercase}
header h1 span{color:var(--amber)}
header .sub{color:#c9d3e0;margin:6px 0 14px;font-size:14px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:600 14px var(--body);background:transparent;color:#c9d3e0;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer}
nav button:hover{color:#fff}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--amber)}
.filtros{display:flex;gap:18px;flex-wrap:wrap;align-items:end;padding:14px 28px 14px 38px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.filtros label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);gap:4px;font-weight:600}
select,input[type=number],input[type=text],input[type=date]{font:14px var(--body);padding:7px 9px;border:1px solid #d6ccbb;border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.seg{display:inline-flex;border:1px solid #d6ccbb;border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font:600 13px var(--body);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
main{padding:22px 28px 60px 38px;max-width:1280px}
section[hidden]{display:none}
h2{font:700 22px var(--head);text-transform:uppercase;color:var(--navy);margin:4px 0 4px;letter-spacing:.3px}
h3{font:600 16px var(--body);margin:0 0 8px;color:var(--navy)}
.lead{color:var(--ink-2);margin:0 0 16px;max-width:860px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tile .lab{font-size:13px;color:var(--ink-2)}
.tile .val{font:600 30px/1.15 var(--body);margin:4px 0 2px;color:var(--ink)}
.tile .del{font-size:13px;font-weight:600}
.up{color:var(--coral-ink)} .down{color:var(--green-ink)} .flat{color:var(--muted)}
.hero{background:var(--navy);color:#fff;border:0}
.hero .val{font:700 64px/1 var(--head);color:var(--amber)}
.hero .lab{color:#c9d3e0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 12px var(--body);color:var(--ink-2);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#f6efe2}tr.sel{background:#f1e8d8}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#efe8dc;color:var(--ink-2)}
.pill.real{background:#e4efdf;color:var(--green-ink)} .pill.base{background:#f3eadb;color:var(--amber-ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--grid)}
.alert:last-child{border-bottom:0}
.ico{font-weight:700;width:22px;text-align:center}
.btn{font:600 14px var(--body);border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)} .btn.ok{background:var(--green-ink);border-color:var(--green-ink)}
.btn.no{background:#fff;color:var(--coral-ink);border-color:var(--coral-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.opcion{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.opcion.activa{outline:3px solid var(--amber)}
.opcion h4{font:700 17px var(--head);text-transform:uppercase;margin:0 0 6px;color:var(--navy)}
.platos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:13px;background:#f3ecdf;border-radius:8px;padding:3px 9px}
.chip b{font-weight:600;color:var(--ink-2);margin-right:4px;font-size:11px;text-transform:uppercase}
.meter{height:10px;border-radius:6px;background:#e6edf5;position:relative;overflow:hidden;margin:6px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:6px}
.meter u{position:absolute;top:0;bottom:0;background:var(--amber);opacity:.55}
.small{font-size:12.5px;color:var(--ink-2)}
.muted{color:var(--muted)}
.ok-t{color:var(--green-ink);font-weight:600}.no-t{color:var(--coral-ink);font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 16px rgba(3,38,79,.12);white-space:nowrap;display:none;z-index:3}
.tip .v{font-weight:700;font-size:15px}
.tip .k{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.legend i.box{height:10px;width:12px;border-radius:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.checks label{display:inline-flex;gap:5px;align-items:center;font-weight:400;color:var(--ink);flex-direction:row}
details{margin-top:8px} summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:14px}
.ingrow{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;margin-bottom:6px}
.note{background:#f3ecdf;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.esc-banner{display:none;align-items:center;gap:10px;background:#fff4dd;border:1px solid var(--amber);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--amber-ink)}
.esc-banner.on{display:flex}
.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px}
.heat td{padding:0;height:26px;min-width:40px;text-align:center;border-radius:4px;border:0;position:relative;cursor:default}
.heat th{border:0;padding:2px 6px;font-weight:600}
.heat td.best::after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-shadow:0 0 2px rgba(0,0,0,.35)}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.scale i{display:inline-block;width:22px;height:12px;border-radius:3px}
.slider{display:grid;grid-template-columns:170px 1fr 64px;gap:10px;align-items:center;padding:4px 0}
.slider input{width:100%;accent-color:var(--navy)}
.preset{font:600 13px var(--body);border:1px solid #d6ccbb;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--navy)}
.preset:hover{background:#f3ecdf}
.antes{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.6em;margin-left:8px}
footer{color:var(--muted);font-size:12px;padding:0 38px 30px}
@media print{header nav,.filtros,.noprint,.stripe{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<header>
  <h1>Predicción de insumos <span>·</span> fondas CDMX</h1>
  <p class="sub" id="sub"></p>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="inicio" aria-selected="true">Mi fonda</button>
    <button role="tab" data-tab="precios">Precios y pronóstico</button>
    <button role="tab" data-tab="platillos">Mis platillos</button>
    <button role="tab" data-tab="menu">Armar menú</button>
    <button role="tab" data-tab="compras">Compras y gasto</button>
    <button role="tab" data-tab="simulador">¿Y si…?</button>
    <button role="tab" data-tab="modelo">El modelo</button>
  </nav>
</header>
<div class="filtros">
  <label>Fonda<select id="f-fonda"></select></label>
  <label>Planeo para dentro de
    <span class="seg" id="f-h">
      <button data-h="1">1 sem</button><button data-h="4">1 mes</button><button data-h="8">2 meses</button><button data-h="12">3 meses</button>
    </span>
  </label>
  <span class="small" id="f-nota"></span>
  <span class="esc-banner" id="esc-banner" role="status"><span id="esc-texto"></span><button class="btn sec" style="padding:3px 10px;font-size:12px" id="esc-quitar">Quitar escenario</button></span>
</div>
<main>
  <section id="tab-inicio"></section>
  <section id="tab-precios" hidden></section>
  <section id="tab-platillos" hidden></section>
  <section id="tab-menu" hidden></section>
  <section id="tab-compras" hidden></section>
  <section id="tab-simulador" hidden></section>
  <section id="tab-modelo" hidden></section>
</main>
<footer id="pie"></footer>
<script id="data" type="application/json">__DATA_JSON__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const INS = Object.fromEntries(D.insumos.map(i => [i.id, i]));
const S = { fonda: D.fondas[0] ? D.fondas[0].id : "nueva", h: 8, insumo: "jitomate", platillo: null };
const TIEMPOS = { entrada: "Entrada", plato_fuerte: "Plato fuerte", guarnicion: "Guarnición", bebida: "Bebida" };
const PROTE = { pollo_pierna_muslo: "pollo", pechuga_pollo: "pollo", res_bistec: "res", res_molida: "res", cerdo: "cerdo", huevo: "huevo", queso_fresco: "queso" };

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "on") for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f);
    else if (v !== null && v !== undefined && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}
const fmt$ = (x, d = 2) => x == null || isNaN(x) ? "—" : "$" + x.toLocaleString("es-MX", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtP = (x, d = 0) => x == null || isNaN(x) ? "—" : (x > 0 ? "+" : "") + x.toFixed(d) + "%";
const hLabel = h => ({ 1: "1 semana", 4: "1 mes", 8: "2 meses", 12: "3 meses" })[h] || h + " semanas";
function clave(k) { return "fondas:" + S.fonda + ":" + k; }
function leer(k, def) { try { const v = localStorage.getItem(clave(k)); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function guardar(k, v) { try { localStorage.setItem(clave(k), JSON.stringify(v)); } catch (e) {} }
function descargarCSV(nombre, filas) {
  const esc = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const blob = new Blob(["﻿" + filas.map(r => r.map(esc).join(",")).join("\n")], { type: "text/csv" });
  const a = el("a", { href: URL.createObjectURL(blob), download: nombre }); document.body.append(a); a.click(); a.remove();
}

/* ---------- precios ---------- */
const ESC = {}; let USAR_ESC = true;  // escenario "¿y si…?": factor multiplicativo sobre el precio futuro
function precio(id, h, q = 2) {
  const i = INS[id]; if (!i) return NaN; if (!h) return i.actual;
  const p = i.pron[Math.min(h, 12) - 1], base = p ? p[q] : i.actual;
  return base * (USAR_ESC && ESC[id] ? ESC[id] : 1);
}
function sinEscenario(fn) { const prev = USAR_ESC; USAR_ESC = false; try { return fn(); } finally { USAR_ESC = prev; } }
function textoEscenario() { return Object.entries(ESC).filter(([, f]) => Math.abs(f - 1) > 1e-9).map(([id, f]) => nombreIns(id) + " " + fmtP(100 * (f - 1))).join(" · "); }
const lo = (id, h) => precio(id, h, 1), hi = (id, h) => precio(id, h, 3);
function cambio(id, h) { return 100 * (precio(id, h) / precio(id, 0) - 1); }
function nombreIns(id) { return INS[id] ? INS[id].nombre : id; }

/* ---------- fonda, platillos y recetas ---------- */
function fondaActual() {
  const f = D.fondas.find(x => x.id === S.fonda);
  if (f) return f;
  return { id: "nueva", nombre: "Mi fonda nueva", tipo: "comida_corrida", alcaldia: "", comensales: 60, merma: 0.12, presupuesto: 10000, precio_comida: 90, menu: [], recetas: {} };
}
function platillosFonda() {
  const f = fondaActual(), propios = leer("propios", {}), precios = leer("precios", {});
  const lista = f.menu.map(m => ({ pid: m.pid, nombre: (D.recetario[m.pid] || {}).nombre || m.pid, tiempo: m.tiempo,
    precio: precios[m.pid] ?? m.precio, pop: m.pop, ing: f.recetas[m.pid] || (D.recetario[m.pid] || {}).ing || [], propio: false }));
  for (const [pid, p] of Object.entries(propios)) lista.push({ pid, nombre: p.nombre, tiempo: p.tiempo, precio: precios[pid] ?? p.precio, pop: null, ing: p.ing, propio: true });
  return lista;
}
function catalogoCompleto() {
  const f = fondaActual(), mios = platillosFonda(), ya = new Set(mios.map(p => p.pid));
  const extra = Object.entries(D.recetario).filter(([pid]) => !ya.has(pid)).map(([pid, r]) => ({ pid, nombre: r.nombre, tiempo: r.tiempo, precio: r.precio_ref, ing: r.ing, propio: false, externo: true }));
  return mios.concat(extra);
}
function costo(ing, h, q = 2) { let t = 0; for (const [id, g] of ing) { const p = precio(id, h, q); if (isNaN(p)) return NaN; t += g / 1000 * p; } return t; }

/* ---------- gráficas (SVG) ---------- */
const NS = "http://www.w3.org/2000/svg";
function sv(tag, a = {}) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); return e; }
function ticks(min, max, n = 4) {
  const span = max - min || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const ini = Math.floor(min / step) * step, fin = Math.ceil(max / step - 1e-9) * step, out = [];
  for (let v = ini; v <= fin + step * 1e-6; v += step) out.push(+v.toFixed(6)); return out;
}
function tipBox(cont) { let t = cont.querySelector(".tip"); if (!t) { t = el("div", { class: "tip" }); cont.append(t); } return t; }
function mostrarTip(cont, x, y, nodos) { const t = tipBox(cont); t.replaceChildren(...nodos); t.style.display = "block"; const w = cont.clientWidth; t.style.left = Math.min(x + 14, w - t.offsetWidth - 4) + "px"; t.style.top = Math.max(0, y - 10) + "px"; }
function ocultarTip(cont) { const t = cont.querySelector(".tip"); if (t) t.style.display = "none"; }

function graficaPrecio(cont, id, h) {
  cont.replaceChildren(); cont.classList.add("chart");
  const ins = INS[id], W = 760, H = 300, m = { l: 52, r: 18, t: 14, b: 30 };
  const hist = ins.hist.slice(-104).map(([d, v]) => [new Date(d), v]);
  const last = hist[hist.length - 1][0];
  const pr = ins.pron.map(([hh, a, b, c]) => [new Date(last.getTime() + hh * 7 * 864e5), a, b, c]);
  const xs = hist.map(d => d[0]).concat(pr.map(d => d[0]));
  const ys = hist.map(d => d[1]).concat(pr.flatMap(d => [d[1], d[3]]));
  const x0 = xs[0], x1 = xs[xs.length - 1], yt = ticks(Math.min(...ys) * 0.95, Math.max(...ys) * 1.03);
  const X = d => m.l + (d - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - yt[0]) / (yt[yt.length - 1] - yt[0]) * (H - m.t - m.b);
  const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `Precio de ${ins.nombre}: historia y pronóstico` });
  for (const v of yt) { svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "#efe8dc" })); const t = sv("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: "#7c8592" }); t.textContent = "$" + v; svg.append(t); }
  const meses = []; let prev = -1; for (const d of xs) { const k = d.getFullYear() * 12 + d.getMonth(); if (k !== prev && d.getDate() <= 7 && d.getMonth() % 3 === 0) meses.push(d); prev = k; }
  for (const d of meses) { const t = sv("text", { x: X(d), y: H - 10, "text-anchor": "middle", "font-size": 11, fill: "#7c8592" }); t.textContent = d.toLocaleDateString("es-MX", { month: "short", year: "2-digit" }); svg.append(t); }
  svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: "#c9bfae" }));
  // banda de pronóstico 80%
  const band = [[last, hist[hist.length - 1][1], hist[hist.length - 1][1]]].concat(pr.map(d => [d[0], d[1], d[3]]));
  svg.append(sv("path", { d: "M" + band.map(d => X(d[0]) + "," + Y(d[2])).join("L") + "L" + band.slice().reverse().map(d => X(d[0]) + "," + Y(d[1])).join("L") + "Z", fill: "#fbb02d", opacity: .22 }));
  svg.append(sv("path", { d: "M" + hist.map(d => X(d[0]) + "," + Y(d[1])).join("L"), fill: "none", stroke: "#03264f", "stroke-width": 2, "stroke-linejoin": "round" }));
  const pl = [[last, hist[hist.length - 1][1]]].concat(pr.map(d => [d[0], d[2]]));
  svg.append(sv("path", { d: "M" + pl.map(d => X(d[0]) + "," + Y(d[1])).join("L"), fill: "none", stroke: "#c98500", "stroke-width": 2.5, "stroke-dasharray": "6 4" }));
  svg.append(sv("line", { x1: X(last), x2: X(last), y1: m.t, y2: H - m.b, stroke: "#c9bfae" }));
  const hoyT = sv("text", { x: X(last) - 6, y: m.t + 10, "text-anchor": "end", "font-size": 11, fill: "#4a5565" }); hoyT.textContent = "hoy"; svg.append(hoyT);
  if (h) { const d = pr[h - 1]; svg.append(sv("circle", { cx: X(d[0]), cy: Y(d[2]), r: 5, fill: "#c98500", stroke: "#fffdf9", "stroke-width": 2 })); }
  svg.append(sv("circle", { cx: X(last), cy: Y(hist[hist.length - 1][1]), r: 5, fill: "#03264f", stroke: "#fffdf9", "stroke-width": 2 }));
  const cross = sv("line", { y1: m.t, y2: H - m.b, stroke: "#4a5565", "stroke-width": 1, visibility: "hidden" }); svg.append(cross);
  const hit = sv("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }); svg.append(hit);
  const puntos = hist.map(d => ({ d: d[0], v: d[1], tipo: "hist" })).concat(pr.map((d, i) => ({ d: d[0], v: d[2], lo: d[1], hi: d[3], tipo: "pron", h: i + 1 })));
  hit.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    let best = puntos[0]; for (const p of puntos) if (Math.abs(X(p.d) - px) < Math.abs(X(best.d) - px)) best = p;
    cross.setAttribute("x1", X(best.d)); cross.setAttribute("x2", X(best.d)); cross.setAttribute("visibility", "visible");
