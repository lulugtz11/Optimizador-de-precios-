<!DOCTYPE html>

<title>Predicción de insumos para fondas · CDMX</title>

<style>
:root{

}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 var(--body)}
.stripe{position:fixed;left:0;top:0;bottom:0;width:10px;display:flex;flex-direction:column;z-index:5}

.stripe i:nth-child(3){background:var(--amber)}.stripe i:nth-child(4){background:var(--brown)}
header{background:var(--navy);color:#fff;padding:20px 28px 16px 38px}
.marca{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;flex:none}
.logo svg{width:30px;height:30px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chips-head{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.1);color:#dbe3ee}
.hchip.vivo{background:rgba(107,169,86,.22);color:#cde8c2}
.hchip.vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(107,169,86,.3)}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
nav button{display:inline-flex;align-items:center;gap:7px;font:600 14px var(--body);background:rgba(255,255,255,.08);color:#dbe3ee;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 15px;cursor:pointer;transition:background .15s}
nav button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:rgba(255,255,255,.16);color:#fff}
nav button[aria-selected=true]{background:var(--amber);border-color:var(--amber);color:var(--navy)}
.filtros{display:flex;gap:18px;flex-wrap:wrap;align-items:end;padding:14px 28px 14px 38px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.filtros label{display:flex;flex-direction:column;font-size:12px;color:var(--ink-2);gap:4px;font-weight:600}
select,input[type=number],input[type=text],input[type=date]{font:14px var(--body);padding:7px 9px;border:1px solid #d6ccbb;border-radius:8px;background:#fff;color:var(--ink);min-width:0}
.seg{display:inline-flex;border:1px solid #d6ccbb;border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 12px;font:600 13px var(--body);color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--navy);color:#fff}
main{padding:22px 28px 60px 38px;max-width:1280px}
section[hidden]{display:none}
h2{font:700 22px var(--head);text-transform:uppercase;color:var(--navy);margin:4px 0 4px;letter-spacing:.3px}
h3{font:600 16px var(--body);margin:0 0 8px;color:var(--navy)}
.lead{color:var(--ink-2);margin:0 0 16px;max-width:860px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile{position:relative;overflow:hidden;padding-top:20px}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--navy)}
.g4>.tile:nth-child(4n+1)::before{background:var(--coral)}.g4>.tile:nth-child(4n+2)::before{background:var(--green)}
.g4>.tile:nth-child(4n+3)::before{background:var(--amber)}.g4>.tile:nth-child(4n+4)::before{background:var(--brown)}
.tile .lab{font-size:13px;color:var(--ink-2);font-weight:600}
.tile .val{font:700 38px/1.1 var(--head);margin:6px 0 4px;color:var(--navy);letter-spacing:.3px}
.tile .del{font-size:13px;font-weight:600}
.tile.hero::before{display:none}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.up{background:#fde3e6;color:var(--coral-ink)}.badge.down{background:#e3f0dc;color:var(--green-ink)}.badge.flat{background:#efe8dc;color:var(--ink-2)}
.sem{background:var(--navy);color:#fff;border:0;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:16px}
.sem .big{font:700 58px/1 var(--head);color:var(--amber)}
.sem .big.mal{color:#ff8a98}.sem .big.bien{color:#9fd98a}
.sem .lab{color:#c9d3e0;font-size:13px;font-weight:600}
.sem .meter{height:16px;background:rgba(255,255,255,.14);margin:10px 0 6px}
.sem .meter i{background:var(--amber)}.sem .meter u{background:#fff;opacity:.35}
.sem .tope{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px}
.sem .pie{display:flex;justify-content:space-between;font-size:13px;color:#c9d3e0;flex-wrap:wrap;gap:6px}
.insrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grid)}
.insrow:last-child{border-bottom:0}
.insrow .nom{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insrow .px{font-size:13.5px;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:999px;background:#efe8dc;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;border-radius:999px}
.plrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 84px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--grid)}
.plrow:last-child{border-bottom:0}
.plrow>.badge{justify-self:end}
@media (max-width:640px){.sem{grid-template-columns:1fr}.g-op{grid-template-columns:1fr}.plrow{grid-template-columns:1fr 70px}.plrow>div:nth-child(2){grid-column:1/-1;grid-row:2}header h1{font-size:22px}}
.fc{position:relative;height:12px;border-radius:999px;background:#e3f0dc;overflow:hidden}
.fc i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:999px}
.fc b{position:absolute;top:0;bottom:0;background:var(--coral);opacity:.75}
.stat{background:#f6efe3;border-radius:12px;padding:10px 12px}
.stat .v{font:700 28px/1.1 var(--head);color:var(--navy);letter-spacing:.3px}
.stat .v.ok{color:var(--green-ink)}
.donut{flex:none}
.sec-t{display:flex;align-items:center;gap:10px;margin:28px 0 12px}

.up{color:var(--coral-ink)} .down{color:var(--green-ink)} .flat{color:var(--muted)}
.hero{background:var(--navy);color:#fff;border:0}

.hero .lab{color:#c9d3e0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 12px var(--body);color:var(--ink-2);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#f6efe2}tr.sel{background:#f1e8d8}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#efe8dc;color:var(--ink-2)}
.pill.real{background:#e4efdf;color:var(--green-ink)} .pill.base{background:#f3eadb;color:var(--amber-ink)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--grid)}
.alert:last-child{border-bottom:0}
.ico{font-weight:700;width:22px;text-align:center}
.btn{font:600 14px var(--body);border-radius:999px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:8px 14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)} .btn.ok{background:var(--green-ink);border-color:var(--green-ink)}
.btn.no{background:#fff;color:var(--coral-ink);border-color:var(--coral-ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.opcion{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--card);display:flex;flex-direction:column}
.opcion.activa{outline:3px solid var(--amber)}
.opcion h4{font:700 19px var(--head);text-transform:uppercase;margin:0;color:var(--navy);letter-spacing:.3px}
.op-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.op-num{width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--amber);font:700 18px var(--head);display:flex;align-items:center;justify-content:center;flex:none}
.op-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:4px 0 12px}
.op-pres{margin-bottom:10px}
.op-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.opcion .row{margin-top:auto}
.g-op{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.platos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{font-size:13px;background:#f3ecdf;border-radius:8px;padding:3px 9px}
.chip b{font-weight:600;color:var(--ink-2);margin-right:4px;font-size:11px;text-transform:uppercase}
.meter{height:14px;border-radius:999px;background:#e6edf5;position:relative;overflow:hidden;margin:6px 0 4px}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:999px}
.meter u{position:absolute;top:0;bottom:0;background:var(--amber);opacity:.7}
.meter.pasa i{background:var(--coral)}
.small{font-size:12.5px;color:var(--ink-2)}
.muted{color:var(--muted)}
.ok-t{color:var(--green-ink);font-weight:600}.no-t{color:var(--coral-ink);font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 4px 16px rgba(3,38,79,.12);white-space:nowrap;display:none;z-index:3}
.tip .v{font-weight:700;font-size:15px}
.tip .k{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px}
.legend i.box{height:10px;width:12px;border-radius:3px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.checks label{display:inline-flex;gap:5px;align-items:center;font-weight:400;color:var(--ink);flex-direction:row}
details{margin-top:8px} summary{cursor:pointer;color:var(--navy);font-weight:600;font-size:14px}
.ingrow{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;margin-bottom:6px}
.note{background:#f3ecdf;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.esc-banner{display:none;align-items:center;gap:10px;background:#fff4dd;border:1px solid var(--amber);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--amber-ink)}
.esc-banner.on{display:flex}
.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px}
.heat td{padding:0;height:26px;min-width:40px;text-align:center;border-radius:4px;border:0;position:relative;cursor:default}
.heat th{border:0;padding:2px 6px;font-weight:600}
.heat td.best::after{content:"★";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;text-shadow:0 0 2px rgba(0,0,0,.35)}
.scale{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.scale i{display:inline-block;width:22px;height:12px;border-radius:3px}
.slider{display:grid;grid-template-columns:170px 1fr 64px;gap:10px;align-items:center;padding:4px 0}
.slider input{width:100%;accent-color:var(--navy)}
.preset{font:600 13px var(--body);border:1px solid #d6ccbb;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--navy)}
.preset:hover{background:#f3ecdf}
.antes{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.6em;margin-left:8px}
footer{color:var(--muted);font-size:12px;padding:0 38px 30px}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;cursor:pointer}
.priv-overlay{position:fixed;inset:0;background:rgba(3,38,79,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.priv-box{background:var(--card);max-width:660px;width:100%;max-height:90vh;overflow:auto;border-radius:16px;padding:24px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.priv-box h2{font:700 24px/1.1 var(--head);text-transform:uppercase;color:var(--navy);margin:0 0 6px}
.priv-box h3{font-size:15px;margin:16px 0 4px;color:var(--navy)}
.priv-box ul{margin:4px 0 0;padding-left:20px}
.priv-box li{margin:2px 0}
.priv-check{display:flex;gap:10px;align-items:flex-start;background:#f6efe3;border-radius:10px;padding:10px 12px;margin-top:12px;cursor:pointer}
.priv-check input{margin-top:3px;accent-color:var(--navy);width:18px;height:18px;flex:none}
.priv-box label:not(.priv-check){display:inline-flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.priv-acciones{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
@media print{header nav,.filtros,.noprint,.stripe{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>

/* ---------- precios ---------- */
const ESC = {}; let USAR_ESC = true;  // escenario "¿y si…?": factor multiplicativo sobre el precio futuro
